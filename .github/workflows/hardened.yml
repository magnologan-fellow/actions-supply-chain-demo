# ============================================================
# AFTER - same pipeline, same third-party action, no blast radius
#
#   1. Actions pinned to full 40-char commit SHAs
#   2. GITHUB_TOKEN explicitly scoped to contents: read
#   3. Untrusted code runs in a job that holds NO secrets
#   4. Cloud creds come from OIDC, so nothing long-lived exists to steal
# ============================================================

name: Build (hardened)

on:
  workflow_dispatch:

# Set at workflow level so every job starts from least privilege.
# Any scope not listed here is set to `none`.
permissions:
  contents: read

jobs:
  # ---- Job 1: runs untrusted third-party code. Holds NOTHING. ----
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0, pinned
        with:
          persist-credentials: false   # don't leave GITHUB_TOKEN in .git/config for later steps

      - name: Analyze changed files
        uses: ./demo-action
        env:
          DEMO_LISTENER: ${{ vars.DEMO_LISTENER }} # Safer with no env, just for demo purposes
          # No secrets reach this step.
          # Even fully compromised, this action has nothing to harvest.

  # ---- Job 2: holds the privileges. Runs only first-party code. ----
  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0, pinned
        with:
          persist-credentials: false

      # Short-lived, identity-bound credentials instead of a stored key.
      # This is the token aws-actions/configure-aws-credentials would trade
      # with AWS STS for temporary credentials. We print its claims (never
      # the token itself) to show what the cloud provider would verify.
      - name: Request OIDC token (what AWS would receive)
        run: |
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$jwt" | cut -d. -f2 | python3 -c '
          import base64, json, sys
          p = sys.stdin.read().strip(); p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("iss", "aud", "sub", "repository", "ref", "workflow", "exp"):
              print(f"  {k}: {c.get(k)}")'

      # With a real IAM role, swap the step above for:
      # - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
      #   with:
      #     role-to-assume: arn:aws:iam::<account-id>:role/<demo-role>
      #     aws-region: us-east-1

      - name: Deploy
        run: echo "deploying..."
